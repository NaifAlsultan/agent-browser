[package]
name = "agent-browser"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "A background browser for AI agents, as an MCP server, built to avoid bot detection"
publish = false

[[bin]]
name = "agent-browser"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process", "io-util", "net"] }
browse-core.workspace = true
browse-page.workspace = true
browse-capture.workspace = true
libc = "0.2"
x11rb = { version = "0.13", default-features = false }

[workspace]
resolver = "3"
members = ["vendor/browse/browse-core", "vendor/browse/browse-page", "vendor/browse/browse-capture"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
browse-core = { path = "vendor/browse/browse-core" }
browse-page = { path = "vendor/browse/browse-page" }
browse-capture = { path = "vendor/browse/browse-capture" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
